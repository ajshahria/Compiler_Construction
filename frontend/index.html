<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Tricora</title>
    <script>
      /* apply the saved theme before the first paint, so a light page does not flash dark */
      try { if (JSON.parse(localStorage.getItem("ce.theme")) === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
